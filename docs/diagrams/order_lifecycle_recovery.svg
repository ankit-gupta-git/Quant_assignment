<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" style="background-color: #fdfdfd; font-family: 'Segoe UI', 'Virgil', 'Comic Sans MS', sans-serif;">
  <defs>
    <filter id="excali-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1e1e1e" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title Badge -->
  <rect x="230" y="16" width="500" height="38" rx="12" ry="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#excali-shadow)"/>
  <text x="480" y="41" font-size="16" font-weight="bold" fill="#6D28D9" text-anchor="middle">ORDER LIFECYCLE, IDEMPOTENCY &amp; CRASH RECOVERY</text>

  <!-- LEFT PANEL: Idempotent Submission -->
  <g transform="translate(40, 75)">
    <rect width="425" height="360" rx="16" ry="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,4" filter="url(#excali-shadow)"/>
    <text x="25" y="32" font-size="15" font-weight="bold" fill="#15803D">PART A: IDEMPOTENT ORDER DISPATCH</text>

    <!-- Step 1 -->
    <rect x="25" y="50" width="375" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
    <text x="35" y="72" font-size="13" font-weight="bold" fill="#166534">1. Strategy Signal Generated</text>
    <text x="35" y="88" font-size="11" fill="#4B5563">Assigns deterministic or unique client_order_id</text>

    <!-- Arrow -->
    <path d="M 212 98 L 212 116" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 2: Idempotency Check -->
    <polygon points="212,122 360,152 212,182 64,152" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <text x="212" y="148" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">ID Already in Cache / DuckDB?</text>
    <text x="212" y="163" font-size="10" fill="#B45309" text-anchor="middle">Async Lock Guard</text>

    <!-- Duplicate Branch (Right) -->
    <path d="M 360 152 L 390 152 L 390 200" stroke="#DC2626" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <rect x="300" y="205" width="110" height="42" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="355" y="223" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">Drop Duplicate</text>
    <text x="355" y="238" font-size="9" fill="#7F1D1D" text-anchor="middle">Return tracked order</text>

    <!-- New Order Branch (Down) -->
    <path d="M 212 182 L 212 205" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="180" y="197" font-size="10" font-weight="bold" fill="#15803D">No (New)</text>

    <!-- Step 3: Persist PENDING -->
    <rect x="25" y="210" width="260" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
    <text x="35" y="232" font-size="13" font-weight="bold" fill="#166534">2. Persist PENDING in DuckDB</text>
    <text x="35" y="248" font-size="11" fill="#4B5563">ACID commit before hitting network</text>

    <!-- Arrow -->
    <path d="M 155 258 L 155 278" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 4: Dispatch & Settle -->
    <rect x="25" y="282" width="375" height="55" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
    <text x="35" y="304" font-size="13" font-weight="bold" fill="#166534">3. Submit to Broker &amp; Settle Fill</text>
    <text x="35" y="322" font-size="11" fill="#4B5563">Transition status to FILLED / REJECTED in DuckDB &amp; Blotter</text>
  </g>

  <!-- RIGHT PANEL: Crash Recovery & Reconciliation -->
  <g transform="translate(495, 75)">
    <rect width="425" height="360" rx="16" ry="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" filter="url(#excali-shadow)"/>
    <text x="25" y="32" font-size="15" font-weight="bold" fill="#1D4ED8">PART B: RECOVERY &amp; RECONCILIATION</text>

    <!-- Step 1 -->
    <rect x="25" y="50" width="375" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
    <text x="35" y="72" font-size="13" font-weight="bold" fill="#1E40AF">1. Engine Reboot / Restart</text>
    <text x="35" y="90" font-size="11" fill="#4B5563">DuckDBStore.load_open_orders() recovers pending state</text>

    <!-- Arrow -->
    <path d="M 212 100 L 212 120" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="25" y="124" width="375" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
    <text x="35" y="146" font-size="13" font-weight="bold" fill="#1E40AF">2. Query Broker Order Book</text>
    <text x="35" y="164" font-size="11" fill="#4B5563">Fetches broker.orders() and open positions via API</text>

    <!-- Arrow -->
    <path d="M 212 174 L 212 194" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 3: Reconcile Comparison -->
    <polygon points="212,198 360,228 212,258 64,228" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <text x="212" y="224" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Local vs Broker Status Mismatch?</text>
    <text x="212" y="239" font-size="10" fill="#B45309" text-anchor="middle">Compare filled_qty, avg_price</text>

    <!-- Arrow -->
    <path d="M 212 258 L 212 280" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="25" y="284" width="375" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
    <text x="35" y="306" font-size="13" font-weight="bold" fill="#1E40AF">3. Sync Discrepancies &amp; Resume</text>
    <text x="35" y="324" font-size="11" fill="#4B5563">Updates DuckDB with true fills, logs audit trail, resumes engine</text>
  </g>
</svg>
