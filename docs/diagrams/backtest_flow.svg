<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background-color: #fdfdfd; font-family: 'Segoe UI', 'Virgil', 'Comic Sans MS', sans-serif;">
  <defs>
    <filter id="excali-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#1e1e1e" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title Badge -->
  <rect x="250" y="16" width="460" height="38" rx="12" ry="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#excali-shadow)"/>
  <text x="480" y="41" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">EVENT-DRIVEN BACKTESTING &amp; ANTI-LOOKAHEAD FLOW</text>

  <!-- Timeline Box Candle t -->
  <g transform="translate(40, 80)">
    <rect width="880" height="265" rx="16" ry="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="8,5" filter="url(#excali-shadow)"/>
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#1E293B">EXECUTION CYCLE FOR BAR [t] (No Look-Ahead Bias Allowed)</text>

    <!-- Phase 1: OPEN Price Execution -->
    <g transform="translate(30, 50)">
      <rect width="250" height="180" rx="12" ry="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#excali-shadow)"/>
      <rect x="15" y="14" width="220" height="28" rx="6" fill="#DBEAFE"/>
      <text x="125" y="33" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">PHASE 1: BAR [t] OPEN</text>
      
      <text x="20" y="70" font-size="12" font-weight="600" fill="#1E293B">• Fills pending orders from [t-1]</text>
      <text x="20" y="92" font-size="12" fill="#4B5563">• Executes strictly at Bar [t] OPEN</text>
      <text x="20" y="114" font-size="12" fill="#4B5563">• Applies Slippage model</text>
      <text x="20" y="136" font-size="12" fill="#4B5563">• Deducts NSE Taxes &amp; STT</text>
      <text x="20" y="158" font-size="11" font-style="italic" fill="#0284C7">Zero reliance on future prices</text>
    </g>

    <!-- Arrow Phase 1 -> Phase 2 -->
    <path d="M 290 140 L 320 140" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- Phase 2: CLOSE Price Evaluation -->
    <g transform="translate(330, 50)">
      <rect width="250" height="180" rx="12" ry="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#excali-shadow)"/>
      <rect x="15" y="14" width="220" height="28" rx="6" fill="#D1FAE5"/>
      <text x="125" y="33" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">PHASE 2: BAR [t] CLOSE</text>
      
      <text x="20" y="70" font-size="12" font-weight="600" fill="#1E293B">• Strategy receives completed bar</text>
      <text x="20" y="92" font-size="12" fill="#4B5563">• Indicators update (ATR, EMA)</text>
      <text x="20" y="114" font-size="12" fill="#4B5563">• Checks Grid &amp; Risk levels</text>
      <text x="20" y="136" font-size="12" fill="#4B5563">• Emits Signals (Buy/Sell/TP/SL)</text>
      <text x="20" y="158" font-size="11" font-style="italic" fill="#059669">Signals CANNOT fill at bar [t]</text>
    </g>

    <!-- Arrow Phase 2 -> Phase 3 -->
    <path d="M 590 140 L 620 140" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- Phase 3: Enqueue for Bar [t+1] -->
    <g transform="translate(630, 50)">
      <rect width="220" height="180" rx="12" ry="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#excali-shadow)"/>
      <rect x="15" y="14" width="190" height="28" rx="6" fill="#FEF3C7"/>
      <text x="110" y="33" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">PHASE 3: ENQUEUE [t+1]</text>
      
      <text x="16" y="70" font-size="12" font-weight="600" fill="#1E293B">• Converts signals to orders</text>
      <text x="16" y="92" font-size="12" fill="#4B5563">• Enqueues as PENDING</text>
      <text x="16" y="114" font-size="12" fill="#4B5563">• Portfolio marked to market</text>
      <text x="16" y="136" font-size="12" fill="#4B5563">• Next cycle fills at [t+1] OPEN</text>
      <text x="16" y="158" font-size="11" font-style="italic" fill="#D97706">Strict causal time arrow</text>
    </g>
  </g>
</svg>
