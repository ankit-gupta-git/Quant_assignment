[tool.poetry]
name = "quant-engine"
version = "1.0.0"
description = "Institutional Quant Trading Engine for Indian Markets (NSE & MCX)"
authors = ["Quant Dev <quant@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.0"
numpy = "^1.26.0"
httpx = "^0.27.0"
websockets = "^12.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
structlog = "^24.2.0"
pandas-ta = "^0.3.14b"
duckdb = "^0.10.0"
pyarrow = "^16.0.0"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
faker = "^25.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
